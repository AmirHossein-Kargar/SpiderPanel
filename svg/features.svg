<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="t d" role="img" viewBox="0 0 1200 520"><title id="t">SpiderPanel feature cards</title><desc id="d">Feature card illustration for SpiderPanel.</desc><rect width="1180" height="500" x="10" y="10" fill="#050506" stroke="#f4f4f5" stroke-width="4" rx="30"/><g font-family="Inter,Arial,sans-serif" font-weight="800"><g transform="translate(45 45)"><rect width="340" height="195" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><circle cx="52" cy="52" r="24" fill="#8b5cf6"/><path stroke="#08080a" stroke-linecap="round" stroke-width="5" d="M42 52h20M52 42v20"/><text x="92" y="58" fill="#fff" font-size="20">USERS</text><text x="34" y="106" fill="#aaaab8" font-size="16">Subscriptions, traffic</text><text x="34" y="130" fill="#aaaab8" font-size="16">limits and account actions.</text><rect width="172" height="12" x="34" y="153" fill="#262630" rx="6"/><rect width="116" height="12" x="34" y="153" fill="#8b5cf6" rx="6"/></g><g transform="translate(430 45)"><rect width="340" height="195" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><circle cx="52" cy="52" r="24" fill="#d946ef"/><path fill="none" stroke="#09090b" stroke-width="4" d="M40 60l12-20 12 20"/><text x="92" y="58" fill="#fff" font-size="20">SCANNER</text><text x="34" y="106" fill="#aaaab8" font-size="16">TCP / SNI / IP checks</text><text x="34" y="130" fill="#aaaab8" font-size="16">with click-to-copy results.</text><path stroke="#2c2c36" stroke-width="4" d="M34 162h250"/><circle cx="78" cy="162" r="6" fill="#8b5cf6"/><circle cx="128" cy="162" r="6" fill="#d946ef"/><circle cx="178" cy="162" r="6" fill="#f4f4f5"/></g><g transform="translate(815 45)"><rect width="340" height="195" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><circle cx="52" cy="52" r="24" fill="#f4f4f5"/><path stroke="#09090b" stroke-width="5" d="M42 52h20M52 42v20"/><text x="92" y="58" fill="#fff" font-size="20">TELEGRAM BOT</text><text x="34" y="106" fill="#aaaab8" font-size="16">Plans, receipts, delivery</text><text x="34" y="130" fill="#aaaab8" font-size="16">and forced channel join.</text><rect width="240" height="12" x="34" y="153" fill="#262630" rx="6"/><rect width="190" height="12" x="34" y="153" fill="#d946ef" rx="6"/></g><g transform="translate(45 275)"><rect width="530" height="180" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><text x="32" y="48" fill="#fff" font-size="21">NODES + WORKERS</text><text x="32" y="85" fill="#aaaab8" font-size="16">Node health, sync, worker setup,</text><text x="32" y="110" fill="#aaaab8" font-size="16">routing helpers and tunnel status.</text><rect width="90" height="10" x="32" y="132" fill="#8b5cf6" rx="5"/><rect width="120" height="10" x="132" y="132" fill="#2a2a34" rx="5"/><rect width="74" height="10" x="262" y="132" fill="#d946ef" rx="5"/></g><g transform="translate(605 275)"><rect width="550" height="180" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><text x="32" y="48" fill="#fff" font-size="21">SUBSCRIPTION + QR</text><text x="32" y="85" fill="#aaaab8" font-size="16">Per-user subscription pages,</text><text x="32" y="110" fill="#aaaab8" font-size="16">config links, QR codes and copy actions.</text><rect width="100" height="100" x="380" y="45" fill="#f4f4f5"/><path fill="#09090b" d="M392 57h30v30h-30zM438 57h30v30h-30zM392 103h30v30h-30zM445 110h16v16h-16zM465 100h10v10h-10z"/></g></g></svg>