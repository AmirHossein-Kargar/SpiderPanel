<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="t d" role="img" viewBox="0 0 1200 480"><title id="t">SpiderPanel architecture</title><desc id="d">SpiderPanel architecture diagram showing web panel, FastAPI backend, Xray, data and Telegram integrations.</desc><rect width="1180" height="460" x="10" y="10" fill="#050506" stroke="#f4f4f5" stroke-width="4" rx="30"/><g fill="#fff" font-family="Inter,Arial,sans-serif" font-weight="800"><text x="55" y="65" font-size="22">SPIDERPANEL · HIGH-LEVEL ARCHITECTURE</text><rect width="285" height="135" x="70" y="110" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><text x="92" y="146" font-size="20">WEB UI</text><text x="92" y="181" fill="#aaaab8" font-size="16">HTML / CSS / JS</text><text x="92" y="210" fill="#aaaab8" font-size="16">Dashboard · Scanner · Bot</text><rect width="300" height="175" x="455" y="90" fill="#111116" stroke="#8b5cf6" stroke-width="4" rx="24"/><text x="485" y="132" font-size="21">FASTAPI CORE</text><text x="485" y="170" fill="#aaaab8" font-size="16">Auth · Users · Nodes</text><text x="485" y="198" fill="#aaaab8" font-size="16">Subscriptions · Scanner</text><text x="485" y="226" fill="#aaaab8" font-size="16">Telegram · Worker APIs</text><rect width="250" height="125" x="860" y="95" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><text x="885" y="132" font-size="20">XRAY / MTProxy</text><text x="885" y="168" fill="#aaaab8" font-size="16">Proxy runtime</text><text x="885" y="196" fill="#aaaab8" font-size="16">Config + routing</text><rect width="235" height="90" x="110" y="315" fill="#111116" stroke="#34343f" rx="20"/><text x="132" y="350" font-size="19">DATA</text><text x="132" y="379" fill="#aaaab8" font-size="15">users · settings · results</text><rect width="235" height="90" x="485" y="315" fill="#111116" stroke="#34343f" rx="20"/><text x="507" y="350" font-size="19">WORKERS / NODES</text><text x="507" y="379" fill="#aaaab8" font-size="15">health · sync · tunnels</text><rect width="250" height="90" x="860" y="315" fill="#111116" stroke="#34343f" rx="20"/><text x="885" y="350" font-size="19">TELEGRAM</text><text x="885" y="379" fill="#aaaab8" font-size="15">Bot API · sales · delivery</text><g fill="none" stroke="#f4f4f5" stroke-linecap="round" stroke-width="4"><path d="M355 178H455"/><path d="M755 178H860"/><path d="M575 265V315"/><path d="M690 265l70 50"/><path d="M485 360H345"/><path d="M755 360H860"/></g><g fill="#f4f4f5"><circle cx="405" cy="178" r="7"/><circle cx="805" cy="178" r="7"/><circle cx="575" cy="290" r="7"/><circle cx="750" cy="312" r="7"/></g></g></svg>