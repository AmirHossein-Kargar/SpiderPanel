<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="t d" role="img" viewBox="0 0 1200 330"><title id="t">SpiderPanel deployment flow</title><desc id="d">Deployment flow from GitHub or VPS to port 8080 and the SpiderPanel interface.</desc><rect width="1180" height="310" x="10" y="10" fill="#050506" stroke="#f4f4f5" stroke-width="4" rx="30"/><g font-family="Inter,Arial,sans-serif" font-weight="800"><g transform="translate(55 85)"><rect width="220" height="150" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><text x="24" y="42" fill="#fff" font-size="20">1 · SOURCE</text><text x="24" y="78" fill="#aaaab8" font-size="16">GitHub repository</text><text x="24" y="106" fill="#aaaab8" font-size="16">or VPS installer</text><circle cx="178" cy="108" r="24" fill="#8b5cf6"/><path stroke="#09090b" stroke-width="5" d="M168 108h20M178 98v20"/></g><path stroke="#f4f4f5" stroke-linecap="round" stroke-width="5" d="M290 160h90"/><path fill="none" stroke="#f4f4f5" stroke-width="5" d="M366 150l14 10-14 10"/><g transform="translate(400 85)"><rect width="220" height="150" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><text x="24" y="42" fill="#fff" font-size="20">2 · BUILD</text><text x="24" y="78" fill="#aaaab8" font-size="16">Docker / Python</text><text x="24" y="106" fill="#aaaab8" font-size="16">automatic setup</text><rect width="120" height="12" x="24" y="120" fill="#8b5cf6" rx="6"/></g><path stroke="#f4f4f5" stroke-linecap="round" stroke-width="5" d="M635 160h90"/><path fill="none" stroke="#f4f4f5" stroke-width="5" d="M711 150l14 10-14 10"/><g transform="translate(745 85)"><rect width="180" height="150" fill="#111116" stroke="#34343f" stroke-width="3" rx="24"/><text x="24" y="42" fill="#fff" font-size="20">3 · PORT</text><text x="24" y="84" fill="#aaaab8" font-size="18">8080</text><rect width="132" height="20" x="24" y="105" fill="#d946ef" rx="10"/></g><path stroke="#f4f4f5" stroke-linecap="round" stroke-width="5" d="M940 160h90"/><path fill="none" stroke="